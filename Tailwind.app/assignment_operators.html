<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Operators</title>
</head>
<body>
    <script  type="text/javascript">
//Exponential Assignment
let b = 5;
const a = 3;
b **=a;
document.write(b+"<br>");
//Remainder Assignment
let r = 6;
const h = 4;
r %=h;
document.write(r+"<br>");
//MDAS Assignment
let text1 = "Mi papa es de Alemania,";
const text2 = " mi companero de trabajo es de Francia ";
text1 +=text2;
document.write(text1+"<br>");
let text3 = "Un cafe ";
const text4 = "y un helado por favor.";
text3 -=text4;
document.write(text3+"<br>");
    </script>
</body>
</html>
