<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dates</title>
  </head>
  <body>
    <script type="text/javascript">
      const date1 = new Date();
      document.write(date1 + "<br>");
      const date2 = new Date(86400000);
      document.write(date2 + "<br>");
      const date3 = new Date("April 15, 2004");
      document.write(date3 + "<br>");
      const date4 = new Date(2022, 7, 22, 11, 30, 25, 75);
      document.write(date4 + "<br>");
      const date5 = new Date(2021, 3);
      document.write(date5 + "<br>");
    </script>
  </body>
</html>
