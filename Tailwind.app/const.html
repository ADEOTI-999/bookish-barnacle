<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let Statement</title>
</head>
<body>
<script type="text/javascript">
 // let and const statement behave the same way but variables declared with const can't be redeclared or reassigned
        try {
            const x = 6;
             x = 8;

        }
        catch (err) {
            document.write(err);
        }
</script>
 
</body>
</html>
