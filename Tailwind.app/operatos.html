<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operators</title>
  </head>
  <body>
    <script type="text/javascript">
      let num1 = 5;
      let num2 = 6;
      const sum = num1 + num1;
      document.write(sum + "<br>");

      let x = 7;
      let y = 2;
      x += y;
      document.write(x + "<br>");

      const text1 = "Que tal,";
      const text2 = "yo tengo";
      const text3 = " uno hermano ";
      const text4 = "tambien";

      const sentence = text1 + text2 + text3 + text4;
      document.write(sentence + "<br>");

      //adition, sunstraction and multiplication can also be used
      const f = 8 / 3;
      document.write(f + "<br>");
      //Exponention
      const a = 3 ** 3;
      document.write(a + "<br>");
      //increment
      let b = 2;
      b++;
      document.write(b + "<br>");
      //Decrement
      let c = 7;
      c--;
      document.write(c + "<br>");
      //Remainder
      const d = 8 % 3;
      document.write(d + "<br>");
      //Operator Sequence
      //MDAS
      const e = 8 + (2 * 4) / 2;
      document.write(e + "<br>");
      const g = ((8 + 2) * 4) / 2;
      document.write(g + "<br>");
      //Cmparison Operators
      const z = 7;
      const w = 6;
      document.write(z == w);
    </script>
  </body>
</html>
