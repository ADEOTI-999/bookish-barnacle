<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navigating Nodes</title>
  </head>
  <body>
    <div id="box">
      <h1>Lorem ipsum</h1>
      <p id="sen">
        Lorem ipsum dolor, Lorem, ipsum dolor sit amet consectetur adipisicing
        elit. tas id
        temporibus. sit amet consectetur a</p>
       <span id="this">Dolores msequi itaque impedit nisi volup</span>
      <a  href="https://javascript.com">Enter here</a>
    </div>
    <script type="text/javascript">
      const pElement = document.getElementById("sen");
      pElement.parentElement.style.background = "silver";
      const divElement = document.getElementById("box");
      divElement.firstElementChild.style.color = "purple";

      const divElement2 = document.getElementById("box");
      divElement2.lastElementChild.style.color = "green";
      divElement2.lastElementChild.style.textDecoration = "red underline solid";
      const divElement3 = document.getElementById("box");
      divElement3.children[2].style.fontSize = "20px";
      divElement3.children[2].style.fontFamily = "cursive";
       divElement3.children[2].style.color = "orange";
       const spanElement = document.getElementById("this");
      spanElement.previousElementSibling.style.background = "aqua";
      
    </script>
  </body>
</html>
