<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSON</title>
  </head>
  <body>
    <p id="de1"></p>
    <p id="dem1"></p>
    <script type="text/javascript">
      //   converting json to js object
      const text = `{
"firstName": "Isa",
"lastName": "Adam",
"age": 28,
"isRich": false
}`;
      const obj = JSON.parse(text);
      document.getElementById("de1").innerHTML =
        obj.firstName + " " + obj.lastName + " is " + obj.age + " years old";
// convert js  to json
         const object = {
"firstName": "Isa",
"lastName": "Adam",
"age": 28,
"isRich": false
};
const txt = JSON.stringify(object);
document.getElementById("dem1").innerHTML = txt;
    </script>
  </body>
</html>
