<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comparison Operaors</title>
  </head>
  <body>
    <p id="de"></p>
    <p id="dem"></p>
    <p id="demo"></p>
    <p id="demon"></p>
    <p id="se"></p>
 <p id="seri"></p>
  <p id="seriosa"></p>
   <p id="solamente"></p>
    <script type="text/javascript">
      //inequality operator
      document.getElementById("de").innerHTML = "esposo" != "esposa";
      //equality operator
      document.getElementById("dem").innerHTML = "esposo" == "esposa";
      //identity opertor
      document.getElementById("demo").innerHTML = 5 === "5";
      //non-identity operator
      document.getElementById("demon").innerHTML = 4 !== 4;
      //greater than operator
      document.getElementById("se").innerHTML = 4.3 > 4;
      //greater than or equal operator
      document.getElementById("seri").innerHTML = 4.3 >= 4;
      //less than operator
      document.getElementById("seriosa").innerHTML =  4.3 < 4;
      //less than or equal operator
      document.getElementById("solamente").innerHTML =  3.3 <= 4;
      //application
      if (5 == 5) {
        document.write("Mi novio es de seroisa")
      }
    </script>
  </body>
</html>
