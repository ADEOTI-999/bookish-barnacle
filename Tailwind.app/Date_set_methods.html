<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Set Methods</title>
</head>
<body>
     <p id="de"></p>
    <p id="dem"></p>
    <p id="demo"></p>
    <p id="demon"></p>
    <p id="de1"></p>
    <p id="dem1"></p>
    <p id="demo1"></p>
    <p id="demon1"></p>
    <p id="de2"></p>
    <p id="dem2"></p>
    <p id="demo2"></p>
    <p id="demon2"></p>
    <script type="text/javascript">
        const date1 = new Date("Mar 21, 2019");
        const date2 = new Date();
        date2.setTime(date1.getTime()+ 86400000);

document.getElementById("de").innerHTML = date2;
const date = new Date();
date.setFullYear("2015");
document.getElementById("dem").innerHTML = date;
const date3 = new Date();
date3.setMonth(3);
document.getElementById("demo").innerHTML = date3;
const date5 = new Date();
date5.setDate(29);
document.getElementById("demon").innerHTML = date5;
const date6 = new Date();
date6.setHours(16);
document.getElementById("de1").innerHTML = date6;
const date7 = new Date();
date7.setMinutes(47);
document.getElementById("dem1").innerHTML = date7;
const date8 = new Date();
date8.setSeconds(39);
document.getElementById("demo1").innerHTML = date8;
const date9 = new Date();
date9.setMilliseconds(360);
document.getElementById("demon1").innerHTML = date9.getMilliseconds();

    </script>
</body>
</html>
