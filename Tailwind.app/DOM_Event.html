<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Events</title>
</head>
<body>
    <img src="/my codes/jug.jpg" id="ime" alt=""><br><br>
<p>Enter something and see what happens</p>
    <input type="text">
    <p id="de"></p>
    <script type="text/javascript">
        const ima = document.getElementById("ime");
        ima.addEventListener("load", function() {
            alert("The image has loaded")
        });
const input = document.getElementsByTagName("input")[0];
input.addEventListener("change", function() {
    document.getElementById("de").innerHTML = input.value;
})
    </script>
</body>
</html>
