<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Colour Changer</title>
    <link rel="stylesheet" href="output.css" />
</head>
<body class="p-4 font-serif text-center w-64">
    <p> Pick a colour:</p>
    <button  class="m-2 py-3 px-3 rounded cursor-pointer border bg-gray-300 text-white-300 text-lg"  id="grey">Grey</button >
    <button  class="m-2 py-3 px-3 rounded cursor-pointer border bg-teal-300 text-white-300 text-lg"  id="teal">Teal</button >
    <button  class="m-2 py-3 px-3 rounded cursor-pointer border bg-lime-600 text-white-300 text-lg"  id="olive">Olive</button >
    <button  class="m-2 py-3 px-3 rounded cursor-pointer border bg-white-300 text-white-300 text-lg"  id="reset">Reset</button >
   
    <script src="extension.js"></script>
</body>
</html>
