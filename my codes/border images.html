<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style type="text/css">
div{
    margin: 10px;
    width: 300px;
    height: 300px;
}
#first{
    padding: 15px;
    border: 10px solid transparent;
    border-image: url("nebula.jpg") round 30%;
}
#second{
 padding: 15px;
    border: 10px solid transparent;
    border-image: url("car.jpg") fill 30;
    
}
#third{
    width: 15rem;
    border: 1.4rem solid;
    margin: 2.1rem;
 border-image: url("nebula.jpg") 40;
 border-image-outset: 1.5;
 background: #cef;
}
#fourth{
     padding: 15px;
    border: 10px solid transparent;
    border-image: url("nebula.jpg") round 30;
}
    </style>
    <title>Border images </title>
</head>
<body>
    <div id="first"></div>
    <div id="second"></div>
    <div id="third"></div>
    <div id="fourth"></div>   
</body>
</html>
