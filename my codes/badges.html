<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Badges</title>
    <style type="text/css">
      .card {
        position: relative;

        height: auto;
        max-width: 70%;
        box-shadow:
          0 5px 10px rgba(0, 0, 0, 0.3),
          0 7px 21px 0 rgba(0, 0, 0, 0.2);
      }
      img {
        max-height: 50dvh;
        width: 100%;
      }
      .badge {
        position: absolute;
        right: 50%;
        bottom: 15%;
        color: white;
        padding: 8px 14px;
        background-color: coral;
        border-radius: 20px;
        font-size: 14px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="honda-civic-1-69540-440x275-MM-80.webp" alt="" />
      <span class="badge"> #800,000 </span>
      <h2>Mercedes S-8</h2>
    </div>

    <div class="card">
      <img src="car2.jpg" alt="" />
      <span class="badge"> #800,000 </span>
      <h2>Mercedes S-8</h2>
    </div>
  </body>
</html>
