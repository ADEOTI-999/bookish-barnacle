<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Interface</title>
    <style type="text/css">
        div {
            padding: 30px;
            width: 60%;
            border: 1px solid black;
            overflow: auto;
        }
        #horizontal {
            resize: horizontal;
        }
        #vertc {
            resize: vertical;
        }
        .both {
            resize: both;
        }
        #offset {
            border: 2px solid blue;
            outline: 5px solid black;
            outline-offset: 5px;
           
        }

    </style>
</head>
<body>
    <div id="horizontal"> resize me horizontally</div><br>
    <div id="vertc">resize me vertically</div><br>
    <div class="both"> resize me</div><br>
    <div id="offset"> Lorb perspiciatis cum neque! Enim officia nostrum omnis!</div>
</body>
</html>
