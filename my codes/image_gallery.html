<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
     <style type="text/css">
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
        }
        .image {
            margin: 0 auto;
            width: 80%;
         height: auto;
            margin-bottom: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.30), 0 11px 8px rgba(0, 0, 0, 0.22);
            transition-duration: 1s;
        }
        .image:hover {
            width: 90%;
            
           
               box-shadow: 0 18px 306x rgba(0, 0, 0, 0.30), 0 14px 11px rgba(0, 0, 0, 0.22);

        }
        img:hover {
            height: 70dvh;

        }

        img {
            height: 50dvh;
            transition-duration: 1s;
            width: 100%;
        }
        .description {
            padding: 0 15px 15px 15px;
            text-align: center;
        }
        /*LIGHTBOX STYLESHEET*/
       .lightbox {
            top: -200%;
            transition-duration: 2s;
            display: table;
            position: fixed;
            width: 100%;
            height: 100%;
            left: 0;
            background: rgba(0, 0, 0, 0.7);
        }
        .lightbox:target {
            top: 0;
        }
        .lightbox-content {
            display: table-cell;
            vertical-align: middle;
            text-align: center;
        }
        .close {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 20px;
            font-weight: 300;
            text-decoration: none;
            color: white;

        }

        .lightbox img {
            max-width: 100%;
            height: 100dvh;
        }



     </style>
</head>
<body>
    <h1>CSS Image Gallery</h1>
    <div class="galllery">
<div class="image">
    <a href="#image1"> <img src="sea.jpg" alt=""></a>
   
    <p class="description">
        Lorem ipsum dolore.
    </p>
</div>

<div class="image">
    <a href="#image2"> <img src="Picture1.png" alt=""></a>
   
    <p class="description">
        Lorem ipsum dolore.
    </p>
</div>

<div class="image">
    <a href="#image3"> <img src="nebula.jpg" alt=""></a>
   
    <p class="description">
        Lorem ipsum dolore.
    </p>
</div>

<div class="image">
    <a href="#image4"> <img src="chain.jpg" alt=""></a>
   
    <p class="description">
        Lorem ipsum dolore.
    </p>
</div>
    </div>
<!--LIGHT BOX-->
    <div class="lightbox" id="image1">
        <a href="#" class="close">CLOSE</a>
        <div class="lcontent">
            <img src="sea.jpg" alt="">
        </div>
    </div>

    <div class="lightbox" id="image2">
        <a href="#" class="close">CLOSE</a>
        <div class="lcontent">
            <img src="Picture1.png" alt="">
        </div>
    </div>

    <div class="lightbox" id="image3">
        <a href="#" class="close">CLOSE</a>
        <div class="lcontent">
            <img src="nebula.jpg" alt="">
        </div>
    </div>

    <div class="lightbox" id="image4">
        <a href="#" class="close">CLOSE</a>
        <div class="lcontent">
            <img src="chain.jpg" alt="">
        </div>
    </div>
</body>
</html>
