<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism</title>
    <style type="text/css">
        body {
            background-image: url(chain.jpg);
            background-position: center;
            background-size: cover;
        }
        .background {
            background:  rgba(0, 0, 0, 0.2);
            border: 1px solid  rgba(255, 255, 255, 0.08);
            position: relative;
            width: 500px;
            color: white;
            backdrop-filter: blur(10px);
            padding: 20px;
        }
        

    </style>
</head>
<body>
    <div class="background">
        <div class="card">
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam itaque veniam vitae aliquam reiciendis dicta nihil nisi assumenda reprehenderit, rerum laboriosam quibusdam minus aliquid cumque, aut magni officia vel unde?</p>

        </div>
    </div>
</body>
</html>
