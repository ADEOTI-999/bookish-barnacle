<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style type="text/css">
        .dd {
            position: relative;
            display: inline-block;
        }
        .content {
            position: absolute;
          
           height: 0;
           transition: height 1s;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.30),  0 14px 11px rgba(0, 0, 0, 0.22);
        }
        .button {
            padding: 15px;
            text-align: center;
            background: chocolate;
            color: aliceblue;
            border: none;
            width: 300px;

        }
        .content > a {
            display: block;
            text-decoration: none;
            padding: 15px;
            color: brown;
        }

        .content > a:hover {
            color: white;
            background-color: coral ;
        }

        .dd:hover > .content {
            
            height: 150px;
        }

    </style>
</head>
<body>
    <div class="dd">
        <button class="button"> Click Here </button>
        <div class="content">
          <a href="#">Home</a>
           <a href="#">Services</a>
            <a href="#">Contacts</a>
        </div>
    </div>
</body>
</html>
