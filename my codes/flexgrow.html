<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Grow</title>
    <style type="text/css"> 
         .container {
            display: flex;
            padding: 5px;
            background: maroon;
        }
        .container:last-of-type > div {
            flex-basis: 100px;

        }
        .container > div {
           
            height: 100px;
            margin: 5px;
            background: coral;
        }
    </style>
</head>
<body>
     <div class="container" >
        <div style="flex-grow: 1;">1</div>
        <div style="flex-grow: 3;">2</div>
        <div style="flex-grow: 1;">3</div>
        <div style="flex-grow: 2;">4</div>

        </div> <br>
        <div class="container">
        <div style="flex-shrink: 2;">1</div>
        <div style="flex-shrink: 2">2</div>
        <div style="flex-shrink: 1">3</div>
        <div style="flex-shrink: 3">4</div>

        </div> 

</body>
</html>
