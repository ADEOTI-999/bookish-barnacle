<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page title</title>
    <style type="text/css">
     #blur  {
        filter: blur(4px);
        max-width: 100%;
        height: auto;
        }
        
         #brightness  {
        filter: brightness(0.5);
        max-width: 100%;
        height: auto;
        }
        
         #contrast   {
        filter: contrast(180%);
        max-width: 100%;
        height: auto;
        }
        
         #drop-shadow   {
        filter: drop-shadow(12px 16px 12px  rgb(23, 52, 89));
        max-width: 100%;
        height: auto;
        }
        
         #grayscale   {
        filter: grayscale(45%);
        max-width: 100%;
        height: auto;
        }
        
         #hue-rotate   {
        filter: hue-rotate(90deg);
        max-width: 100%;
        height: auto;
        }
        
         #invert   {
        filter: invert(75%);
        max-width: 100%;
        height: auto;
        }
        
         #opacity   {
        filter: opacity(45%);
        max-width: 100%;
        height: auto;
        }
        
         #saturate  {
        filter: saturate(30%);
        max-width: 100%;
        height: auto;
        }
        
         #sepia  {
        filter: sepia(60%);
        max-width: 100%;
        height: auto;
        }
        
         #none   {
        filter: none; 
        max-width: 100%;
        height: auto;
        }
        
        
    </style>
</head>
<body>
    <img id="none" src="car.jpg" alt="unavailable">
<img id="brightness" src="car.jpg" alt="unavailable">
<img id="contrast" src="car.jpg" alt="unavailable">
<img id="drop-shadow" src="car.jpg" alt="unavailable">
<img id="grayscale" src="car.jpg" alt="unavailable">
<img id="hue-rotate" src="car.jpg" alt="unavailable">
<img id="invert" src="car.jpg" alt="unavailable">
<img id="opacity"src="car.jpg" alt="unavailable">
<img id="saturate" src="car.jpg" alt="unavailable">
<img id="sepia" src="car.jpg" alt="unavailable">
<img id="blur" src="car.jpg" alt="unavailable">

</body>
</html>
