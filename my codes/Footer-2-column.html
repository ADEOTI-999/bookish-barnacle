<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Column Footer</title>
    <style type="text/css">
        * {
            box-sizing: border-box;
        }
        html, body {
        padding: 0;
            margin: 0;
        }
        body {
            display: flex;
            min-height: 100vh;
            flex-direction: column;

        }
        main {
            flex: 1 0 auto;
        }
        footer {
            color: white;
            background: #333;
            font-size: 80%;
            position: relative;
        }
        .footer-copyright {
            width: 100%;
            height: 40px;
            background: black;
            padding: 10px;
            position: absolute;
            left: 0;
            bottom: 0;
        }
        .footer-body {
            margin-bottom: 40px;
           
        }
        .footer-body::after {
            content: "";
            display: block;
            clear: both;
        }
        .footer-body > div{
            float: left;
            padding: 10px;
        }
        .footer-body > div:first-child {
            font-size: 150%;
            text-align: center;
            width: 35%;
        }
        .footer-body > div:last-child {
            width: 65%;
        }

        .footer-body ul {
        list-style-type: none;
        margin: 0px;
        padding: 0px;
        text-align: center;
        }
        .footer-body li > a {
            color: white;
            text-decoration: none;
            margin-bottom: 7px;
        }

    </style>
</head>
<body>
    <header></header>
     <main></main>
     <footer>
        <div class="footer-body">
            <div> Adeoti automobiles</div>
            <div>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing Lorem ipsum dolor sit amet consectetur uae officiis vel, animi labore iusto repellendus molestiae culpa itaque facere quod adipisci praesentium.tium ab officiis hic.</p>
                <ul>
              <li><a href="#">Home</a></li>
             <li><a href="#">Services</a></li>
              <li><a href="#">About</a></li>
               <li><a href="#">Gallery</a></li>
                </ul>
            </div>
        </div>
        <div class="footer-copyright">
            &copy; Adeoti limited
        </div>
     </footer>
</body>
</html>
