<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Box</title>
    <style type="text/css">
        .lightbox {
            top: -200%;
            transition-duration: 2s;
            display: table;
            position: fixed;
            width: 100%;
            height: 100%;
            left: 0;
            background: rgba(0, 0, 0, 0.7);
        }
        .lightbox:target {
            top: 0;
        }
        .lightbox-content {
            display: table-cell;
            vertical-align: middle;
            text-align: center;
        }
        .close {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 20px;
            font-weight: 300;
            text-decoration: none;
            color: white;

        }

        img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <a href="#example">Show Me</a>

    <div class="lightbox" id="example">
        <a href="#" class="close">CLOSE</a>
        <div class="lightbox-content">
            <img src="sea.jpg" alt="">
        </div>
    </div>
</body>
</html>
