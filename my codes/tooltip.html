<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip</title>
    <style type="text/css">
        * {
            box-sizing: border-box;
        }
        .container {
            margin-top: 30px;
            text-align: center;
        }
        .tooltip {
            position: relative;
            border-bottom: 1px solid black;

        }
        .tooltip-content {
            color: white;
            background: black;
            padding: 3px;
            border-radius: 5px;
            top: -150%;
            width: 110px;
            left: 50%;
            margin-left: -55px;
            opacity: 0;
            transition-duration: 1s;
            position: absolute;
            z-index: 1;
            text-align: center;
            width: 110px;
        }
        .tooltip > .tooltip-content::after {
            content: "";
            position: absolute;
            border: 5px solid transparent;
            top: 100%;
            margin-left: -5px;
            left: 50%;
            border-top-color: black;

        }
        .tooltip:hover > .tooltip-content {
           opacity: 1;
        }

    </style>
</head>
<body>
    <div class="container">
        <span class="tooltip">Here
            <span class="tooltip-content">
                See me
            </span>
        </span>
    </div>
</body>
</html>
