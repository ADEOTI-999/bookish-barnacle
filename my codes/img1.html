<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My card</title>
    <style type="text/css">
        .card {
            width: 250px;
            box-sizing: border box;
            box-shadow: 0 15px 30px rgba(0,0,0,0.30), 0 11px 8px rgba(0,0,0,0.22);
            transition-duration: 2s;
        }
       .card > img {
            display: block;
            height: auto;
            max-width: 100%;
            margin: 0px;
            
          
        }
        img:hover{
            opacity: 1;
        }
        .card > p {
            font-family: serif;
            padding: 0px 10px 10px 10px;
            text-align: center;
        }
        .card:hover {
            box-shadow: 0 18px 36px rgba(0,0,0,0.30), 0 14px 11px rgba(0,0,0,0.22);
      width: 270px;
        }
    </style>
</head>
<body>
      <div class="card">
          <img src="rolls_royce.jpg">
          <p>
              Rolls-Royce is a luxury car brand known for handcrafted vehicles. Their cars symbolize status and excellence. Prices start around ₦100 million ($250,000+).
          </p>
      </div>
    
</body>
</html>
