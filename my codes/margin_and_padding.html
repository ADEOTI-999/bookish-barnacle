<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page title</title>
    <style type="text/css">
        #marin{
            margin: 0 auto;
            background: silver;
            width: 200px;
            height: 200px;
            border: blue  1px dotted;
        }
        #pad {
            width:200px;
            height: 100px;
            background: aqua;
            border: 1px dashed;
            padding: 10px;
            box-sizing: border-box;
        }
        /*NOTICE THE SIMILARITIES AND DIFFERENCES*/
        #box {
            width: 200px;
            height: 200px;
            padding: 50px;
            border: 20px solid green;
        }
        #box-sized {
            width: 200px;
            height: 200px;
            padding: 50px;
            border: 20px solid green;
            box-sizing: border-box
        }
        #sample {
            width: 340px;
            height: 340px;
            background: red;
        }
    </style>
</head>
<body>
    <div id="marin" ></div>
    <br>
    <div id="pad"></div><br>
    <div id="box"></div><br>
    <div id="sample"></div><br>
    <div id="box-sized"></div
</body>
</html>
