<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Overlay</title>
   <style type="text/css">
    .home {
        height: 100vh;
        background-size: cover;
        background-position: center;
        background-image: url(sea.jpg);
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;


    }
    .overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
    }
    .content {
        position: relative;
        z-index: 1;
        text-align: center;
        color: white;
        z-index: 1;
    }

   </style>

</head>
<body>
    <section class="home">
        <div class="overlay"></div>
        <div class="content">
            <h3>d fff f   fy fyf f</h3>
            <p>

            </p>
        </div>

    </section>
</body>
</html>
