<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BREAD CRUMBS</title>
     <style type="text/css">
        .bread-crumbs {
            background: coral;
            padding: 10px;
        }
        .bread-crumbs ul {
            margin: 0;
            padding: 0;
        }
        .bread-crumbs li {
            display: inline-block;
        }
        .bread-crumbs li::before {
            content: "⟩";
            color: white;
            margin: 0 8px;
        }
        .bread-crumbs li:first-child::before {
            content: "/";
            color: white;
            margin: 0 0;
            
        }
        .bread-crumbs li > a {
            text-decoration: none;
            border-bottom: 1px solid white;
            color: white;

        }
        .bread-crumbs li:last-child > a{
            border: none; 
                        color: white;

            text-decoration: none;
        }



     </style>
</head>
<body>
    <div class="bread-crumbs">
        <ul>
             <li><a href="#" >Home</a></li>
             <li><a href="#">4-Wheeled</a></li>
              <li><a href="#">Merceedes benz</a></li>
        </ul>
    </div>
</body>
</html>
