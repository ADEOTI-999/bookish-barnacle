<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter</title>
     <style type="text/css">
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 40px 0;
        }
        .buttons button {
            padding: 10px 20px;
            border: none;
            border-radius: 30px;
            background: olive;
            color: lime;
            cursor: pointer;
            transition: 0.3s;

        }
        .buttons button:hover {
            background: lime;
            color: olive;
            box-shadow: 0 0 20px silver;
        }

     </style>
</head>
<body>
    <div class="buttons">
        
        <button>All</button>
        <button>Street</button>
        
        <button>Track</button>
        <button>Drift</button>
        <button>Race</button>
    </div>
</body>
</html>
